name: Update COT Data

on:
  schedule:
    # 每日 UTC 22:00：常规采集 + Treasury Debt to the Penny 日更新检查。
    - cron: '0 22 * * *'
    # 周六 UTC 18:00 更新 COT（CFTC 周五发布）
    - cron: '0 18 * * 6'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update-cot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests curl_cffi xlrd pdfplumber

      # 校验逻辑自身的单元测试（不联网）。挂在采集之前：校验器坏了就该立刻知道，
      # 而不是等它误隔离好数据或漏放坏数据。
      - name: Run validation unit tests
        id: tests
        run: |
          python fetch_cot.py --test
          python fetch_gold.py --test
          python fetch_stocks.py --test
          python fetch_oi.py --test
          python derive_term_structure.py --test
          python fetch_fred.py --test
          python derive_macro.py --test
          python fetch_treasury_debt.py --test
        continue-on-error: true

      # 每个采集步骤互不连累：任一失败都不能让其余步骤被跳过，
      # 否则一次 COT 故障会连带丢掉当天的 OI 数据（CME 无历史归档，丢了就没了）。
      # 失败信息由末尾的统一闸门汇总报出。
      # COT exit code：0 正常 / 1 数据、解析或业务校验失败，需人工介入 /
      # 2 CFTC 上游暂时不可达，本次保留旧 cot.json，等待下次自动重试。
      # continue-on-error 无法区分 1/2，必须把真实进程码写入 step output。
      - name: Run fetch_cot.py
        id: cot
        run: |
          set +e
          python fetch_cot.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      # exit code 三态：0 正常 / 1 校验失败需人工介入 / 2 上游未更新（两源
      # 皆不可达，或 cot.json 无 weekly）。与 stocks 同一处理，理由见其注释。
      - name: Run fetch_gold.py
        id: gold
        run: |
          set +e
          python fetch_gold.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      # exit code 三态：0 正常 / 1 校验失败需人工介入 / 2 上游未更新（WAF 封锁）。
      # continue-on-error 会把 1 和 2 都记成 outcome=failure，闸门分不清 ——
      # 显式捕获 exit code 存进 outputs，让末尾闸门按三态分别处理。
      - name: Run fetch_stocks.py
        id: stocks
        run: |
          set +e
          python fetch_stocks.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      # 采集层校验（Trade Date / 重复比对 / 合约数量 / 主力月持仓）在这一步内。
      # 校验失败时坏数据进 data/quarantine/，data/oi.json 保持上一份可用数据。
      #
      # exit code 三态：0 正常 / 1 需人工介入（校验不过，或拿到 PDF 却解析失败）
      # / 2 上游未更新（下载失败，或响应不是 PDF —— WAF 挑战页是 200+HTML）。
      # 与 gold/stocks 同一写法，理由见其注释。
      - name: Run fetch_oi.py
        id: oi
        run: |
          set +e
          python fetch_oi.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      # Treasury Fiscal Data / Debt to the Penny：真实日频 total/public/intragov，
      # 不需要 API key。周六 UTC 18:00 是 COT 的额外时段；Treasury 在同日 UTC
      # 22:00 的每日常规任务运行，避免重复检查。
      # exit 0 = 新数据写入或当天尚无新 record（幂等）；1 = 格式/数据异常，响应
      # 已隔离且旧文件不覆盖；2 = 网络临时不可达，保留旧文件等待次日重试。
      - name: Run fetch_treasury_debt.py
        id: treasury_debt
        if: github.event.schedule != '0 18 * * 6'
        run: |
          set +e
          python fetch_treasury_debt.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      # FRED 十三个序列（UST 2Y/10Y/30Y、Fed 目标区间上下限、DFF、CPIAUCSL、CPILFESL，
      # 以及 GFDEBTN/FYGFDPUN/FDHBATN/FDHBFIN/GDP 五个债务与 GDP 序列）。
      # 逐序列独立下载/解析/校验/落盘，一个序列失败不影响其余，见 fetch_fred.py:188 process_one。
      #
      # exit code 四态：0 正常 / 1 需人工介入（c 类解析失败已隔离原始响应；
      # d 类校验不过已隔离并落 data:null）/ 3 FRED_API_KEY 缺失或无效 /
      # 2 上游未更新（a 类下载失败、b 类响应顶层格式非法）。
      #
      # 汇总按**严重度**取，不是 max()：fetch_fred.py 的 EXIT_SEVERITY 显式定义
      # 1 > 3 > 2 > 0（数值大小与严重度无关）。此前用 max() 时，一个序列 d 类失败(1)
      # 撞上另一个序列下载失败(2)，进程码会变成 2，把「要人管」报成「上游没更新」；
      # 闸门那边为此加过一条数 "c/d exit 1" 行的 grep 绕过，现在源头修好，绕过已删。
      # 回归闸门在 fetch_fred.py --test 里（"c/d 与 a 同批时进程码=1" 等 5 条）。
      - name: Run fetch_fred.py
        id: fred
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set +e
          python fetch_fred.py 2>&1 | tee /tmp/fred.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      # 派生数据可从 oi.json 随时重算，失败不阻断提交
      - name: Run derive_term_structure.py
        id: derive
        run: python derive_term_structure.py
        continue-on-error: true

      # 宏观派生：三条链解耦（rates 读 6 个上游 / cpi 读 2 个 / debt 读 5 个），
      # 一条失败时其余链照常产出，
      # 失败的那条保留上一版文件。派生数据可从 data/*.json 随时重算，失败不阻断提交。
      #
      # exit code 只有两态：0 正常 / 1 至少一条链的上游缺失、非信封、空或全 null
      # （derive_macro.py:366 `return 1 if failures else 0`）—— **不产生 2**。
      # 仍显式捕获码而不只看 outcome：出现 2 或其它码说明是未预期的崩溃路径，
      # 闸门要能把它和「上游没更新」区分开报出来。
      - name: Run derive_macro.py
        id: derive_macro
        run: |
          set +e
          python derive_macro.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      # 原始数据不可再生（CME 无历史归档），无条件落盘：
      # 上面任何一步失败都不能连累已经拿到的采集数据，隔离区同样要提交。
      - name: Commit and push if data changed
        id: commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 逐个 add：任一文件缺失（对应采集步骤失败）不影响其余文件入库
          for f in data/cot.json data/gold_price.json data/stocks.json \
                   data/oi.json data/derived/term-structure-series.json \
                   data/ust_dgs2.json data/ust_dgs10.json data/ust_dgs30.json \
                   data/fed_target_upper.json data/fed_target_lower.json \
                   data/fed_effective_rate.json \
                   data/cpi_cpiaucsl.json data/cpi_cpilfesl.json \
                   data/debt_total.json data/debt_held_public.json \
                   data/debt_intragov.json data/debt_foreign.json \
                   data/gdp_nominal.json data/treasury_debt_daily.json \
                   data/derived/macro_rates.json data/derived/macro_cpi.json \
                   data/derived/macro_debt.json; do
            git add "$f" 2>/dev/null || true
          done
          # 隔离区必须提交：CME 只提供当日文件，坏数据错过就永久拿不回来
          git add data/quarantine 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          DATE=$(python -c "import json;print(json.load(open('data/cot.json'))['latest']['date'])" 2>/dev/null || date -u +%Y-%m-%d)
          if git diff --cached --name-only | grep -q '^data/quarantine/'; then
            git commit -m "data: 数据更新 ${DATE}（含隔离数据，见 data/quarantine/）"
          else
            git commit -m "data: COT+金价+库存+宏观数据更新 ${DATE}"
          fi
          git push

      # 统一闸门：数据已落盘后再让 job 变红。
      # 消息明确指出是哪一层挂了（采集 / 派生 / 提交），红灯时无需翻日志。
      - name: Report failures
        if: always()
        run: |
          FAILED=0

          fail() {
            echo "::error title=$1::$2"
            FAILED=1
          }

          [ "${{ steps.tests.outcome }}"  = "failure" ] && \
            fail "校验器自检" "八个 --test 中至少一个失败（fetch_cot / fetch_gold / fetch_stocks / fetch_oi / derive_term_structure / fetch_fred / derive_macro / fetch_treasury_debt）—— 校验逻辑本身有问题，本次采集的校验结果不可信。具体哪个见该步骤日志"
          # COT 按真实 exit code 三态处理，不能只看 step outcome：
          # continue-on-error 会把 1/2 都折叠成 failure，丢失故障类别。
          case "${{ steps.cot.outputs.code }}" in
            1) fail "采集层：COT" "COT 数据/解析/校验失败，需要人工介入；cot.json 保持上一份。有可用响应证据时已保存到 data/quarantine/。详见该步骤日志" ;;
            2) echo "::warning title=采集层：COT::CFTC/COT 上游暂时不可达；cot.json 保持上一份；等待下一次自动任务重试。这不是业务数据校验失败" ;;
            0|"") : ;;
            *) fail "采集层：COT" "fetch_cot.py 以未预期的 exit code ${{ steps.cot.outputs.code }} 退出（fetch_cot 只应产生 0 / 1 / 2）" ;;
          esac
          # 金价按 exit code 两态处理。**gold 不产生 exit 2**：
          #   1 = 需人工介入（5 项校验失败／两源皆不可达／cot.json 无 weekly）。
          #       这三种都已落 data:null + coverage:null，三段证据在
          #       data/quarantine/gold-*.json（raw / parse / align）
          #   0 = 正常落盘，含幂等跳过（data 逐条相同 → 不写盘、不刷 generated_at）
          # 原先有一条 2) 只告警的分支，随 fetch_gold 落 data:null 一并删除 ——
          # 「保持上一份」这个行为已不存在，留着那条分支会让读 yml 的人
          # 以为该状态仍可能出现（永不命中的分支比没有分支更误导）。
          case "${{ steps.gold.outputs.code }}" in
            1) fail "采集层：金价" "fetch_gold.py 需人工介入 —— 已落 data:null + coverage:null，三段证据在 data/quarantine/gold-*.json。页面金价线会整条消失（这是有意的显式失败，不是静默陈旧）。详见该步骤日志" ;;
            0|"") : ;;
            *) fail "采集层：金价" "fetch_gold.py 以未预期的 exit code ${{ steps.gold.outputs.code }} 退出（gold 只应产生 0 或 1）" ;;
          esac
          # 库存按 exit code 三态分开处理：
          #   1 = 校验失败，坏数据已隔离，需人工介入 → 红
          #   2 = CME WAF 封锁／上游未更新，属正常 → 只告警，不红
          case "${{ steps.stocks.outputs.code }}" in
            1) fail "采集层：库存" "fetch_stocks.py 未通过 5 项校验 —— 坏数据已隔离到 data/quarantine/，stocks.json 保持上一份。详见该步骤日志" ;;
            2) echo "::warning title=采集层：库存::CME WAF 封锁，本次未取到数据，stocks.json 保持上一份（非异常）" ;;
            0|"") : ;;
            *) fail "采集层：库存" "fetch_stocks.py 以未预期的 exit code ${{ steps.stocks.outputs.code }} 退出" ;;
          esac
          # 期限结构按 exit code 三态分开处理（与 stocks 同构）：
          #   1 = 需人工介入 —— 4 项校验不过，或拿到 PDF 却解析不了
          #       （版式变更 / pdfplumber 行为变化）。证据在 data/quarantine/
          #   2 = 上游未更新 —— 下载失败，或响应根本不是 PDF（WAF 挑战页是
          #       200 + text/html，靠 status 分不出来，看魔数才知道）。属正常
          # 原先只看 outcome，1 和 2 都被 continue-on-error 记成 failure，
          # 于是「CME 拦了我们」和「PDF 版式变了」在闸门上同一个颜色。
          case "${{ steps.oi.outputs.code }}" in
            1) fail "采集层：期限结构" "fetch_oi.py 需人工介入 —— 未通过 4 项校验，或拿到 PDF 但解析失败。坏数据／原始 PDF 已隔离到 data/quarantine/，oi.json 保持上一份。详见该步骤日志中的具体校验项" ;;
            2) echo "::warning title=采集层：期限结构::CME 未返回可用 PDF（下载失败或响应非 PDF），oi.json 保持上一份（非异常）" ;;
            0|"") : ;;
            *) fail "采集层：期限结构" "fetch_oi.py 以未预期的 exit code ${{ steps.oi.outputs.code }} 退出" ;;
          esac
          # Treasury Debt to the Penny 三态：没有新 record 属幂等 exit 0；网络失败
          # exit 2 只告警；确定性格式/数据异常 exit 1 报红且保留旧主文件。
          # 周六 18:00 COT 专场会跳过本步骤，output 为空，必须与 0 同样接受。
          case "${{ steps.treasury_debt.outputs.code }}" in
            1) fail "采集层：Treasury debt" "fetch_treasury_debt.py 检测到格式或数据异常（exit 1）—— 证据已隔离到 data/quarantine/，treasury_debt_daily.json 保持上一份。详见该步骤日志" ;;
            2) echo "::warning title=采集层：Treasury debt::Fiscal Data 上游暂时不可达；treasury_debt_daily.json 保持上一份，等待下一次每日任务重试" ;;
            0|"") : ;;
            *) fail "采集层：Treasury debt" "fetch_treasury_debt.py 以未预期的 exit code ${{ steps.treasury_debt.outputs.code }} 退出（只应产生 0 / 1 / 2）" ;;
          esac
          # FRED 按 exit code 四态处理，只看进程码即可 —— 汇总已按严重度取
          # （fetch_fred.py 的 EXIT_SEVERITY，1 > 3 > 2 > 0），同批的 2 不会再盖住 1，
          # 原先那条数 "c/d exit 1" 行的 grep 绕过已删。
          #   1 = 需人工介入 —— c 类原始响应已隔离；d 类已隔离并落 data:null + coverage:null
          #   3 = FRED_API_KEY 缺失或无效 —— 配置问题，等不来自愈，必须有人去看，故报红。
          #       从前它混在 2 里只告警，能连日不红；现在单独一态。
          #   2 = 上游未更新 —— a 类下载失败 / b 类顶层格式非法。只告警不红：
          #       FRED 提供完整历史，下次跑能补回；失败序列保持上一份，
          #       同批成功序列仍会正常更新。
          case "${{ steps.fred.outputs.code }}" in
            1) fail "采集层：FRED" "fetch_fred.py 需人工介入（exit 1）—— c 类解析失败的原始响应已隔离到 data/quarantine/，d 类对应文件已落 data:null + coverage:null。详见该步骤日志中的逐序列行" ;;
            3) fail "采集层：FRED" "FRED_API_KEY 缺失或无效（exit 3）—— 十三个序列一个都没取到，文件保持上一份。去 Settings → Secrets and variables → Actions 检查 secrets.FRED_API_KEY 是否存在、是否过期、是否被 fork/环境限制挡掉；key 在 https://fredaccount.stlouisfed.org/apikeys 重发" ;;
            2) echo "::warning title=采集层：FRED::部分 FRED 序列未返回可用数据（下载失败或响应格式非法）；失败序列保持上一份，同批成功序列仍会正常更新（非异常）。key 问题不落在这一态，另有 exit 3" ;;
            0|"") : ;;
            *) fail "采集层：FRED" "fetch_fred.py 以未预期的 exit code ${{ steps.fred.outputs.code }} 退出（fetch_fred 只应产生 0 / 1 / 2 / 3）" ;;
          esac
          [ "${{ steps.derive.outcome }}" = "failure" ] && \
            fail "派生层" "derive_term_structure.py 失败 —— term-structure-series.json 保持上一版，页面回放停留在旧数据。原始数据已落盘，修好后重跑即可重算"
          # 宏观派生只有 0/1 两态（无 2）。exit 1 = rates/CPI/debt 至少一条链的
          # 上游缺失/非信封/空/全 null，
          # 那条链保留上一版文件、另一条照常产出 —— 是失败隔离生效，不是全盘失败。
          case "${{ steps.derive_macro.outputs.code }}" in
            1) fail "派生层：宏观" "derive_macro.py 至少一条派生链失败（上游缺失 / 非信封 / 空 / 全 null）—— 失败链保留上一版 macro_rates.json、macro_cpi.json 或 macro_debt.json，其他链照常产出。宏观页面对应模块停留在旧数据，原始采集已落盘，修好上游后重跑即可重算" ;;
            0|"") : ;;
            *) fail "派生层：宏观" "derive_macro.py 以未预期的 exit code ${{ steps.derive_macro.outputs.code }} 退出（derive_macro 只应产生 0 或 1）" ;;
          esac
          [ "${{ steps.commit.outcome }}" = "failure" ] && \
            fail "提交层" "commit/push 失败 —— 本次采集到的数据未能入库，需人工介入"

          if [ "$FAILED" = "1" ]; then
            echo "::error::本次运行有步骤失败（详见上方 error 注释）。原始采集数据已尽力落盘。"
            exit 1
          fi
          echo "所有步骤正常。"
